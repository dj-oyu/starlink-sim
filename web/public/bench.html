<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wasm bench</title>
  <style>
    body { font: 14px/1.4 -apple-system, sans-serif; background: #0b1220; color: #e2e8f0; margin: 0; padding: 16px; }
    button { font-size: 16px; padding: 10px 16px; margin-right: 8px; border-radius: 8px; border: 1px solid #38bdf8; background: #0c4a6e; color: #fff; }
    pre { white-space: pre-wrap; word-break: break-word; background: #020617; padding: 12px; border-radius: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <h3>Wasm SGP4 bench (描画なし)</h3>
  <p>「Run」をタップ。約20秒かかります。終わったら「Copy」で結果をコピーしてください。(計測中は Web インスペクタを接続しないでください)</p>
  <button id="run">Run</button><button id="copy">Copy</button>
  <pre id="out">待機中</pre>
  <script type="module">
    const out = document.getElementById('out');
    const log = (s) => { out.textContent += '\n' + s; };
    const NL = String.fromCharCode(10);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const med = (a) => { const b = [...a].sort((x, y) => x - y); return b[b.length >> 1]; };

    async function run() {
      out.textContent = 'loading...';
      const res = {};
      res.ua = navigator.userAgent;
      res.hardwareConcurrency = navigator.hardwareConcurrency;
      // timer resolution
      let minDelta = Infinity;
      for (let i = 0; i < 2000; i++) { const a = performance.now(); let b = a; while (b === a) b = performance.now(); minDelta = Math.min(minDelta, b - a); }
      res.timerResolutionMs = +minDelta.toFixed(4);

      const [wasmBuf, tle] = await Promise.all([
        fetch('/assets/wasm/starlink-sim.wasm').then((r) => r.arrayBuffer()),
        fetch('/assets/data/starlink.tle').then((r) => r.text()),
      ]);
      const t0 = performance.now();
      const { instance } = await WebAssembly.instantiate(wasmBuf, {});
      res.instantiateMs = +(performance.now() - t0).toFixed(1);
      const a = instance.exports;
      const exp = (s) => { s = s.trim(); return parseFloat(s.slice(0, -2).replace(/^([+-]?)(\d)/, '$1.$2')) * Math.pow(10, parseInt(s.slice(-2))); };
      let l1 = null;
      for (const l of tle.split('\n')) {
        if (l.startsWith('1 ') && l.length >= 61) l1 = l;
        else if (l.startsWith('2 ') && l1) {
          a.add_satellite_elements(parseInt(l1.slice(2, 7)), parseInt(l1.slice(18, 20)), parseFloat(l1.slice(20, 32)), exp(l1.slice(53, 61)), parseFloat(l.slice(8, 16)), parseFloat(l.slice(17, 25)), parseInt(l.slice(26, 33)) * 1e-7, parseFloat(l.slice(34, 42)), parseFloat(l.slice(43, 51)), parseFloat(l.slice(52, 63)));
          l1 = null;
        }
      }
      res.satellites = a.get_satellite_count();
      let t = Date.now();

      // 1) warm-up curve: median of each 10-call round (shows whether the engine tiers up)
      res.propagateRoundMedianMs = [];
      for (let r = 0; r < 24; r++) {
        const ts = [];
        for (let i = 0; i < 10; i++) { const s = performance.now(); a.propagate_constellation((t += 16)); ts.push(performance.now() - s); }
        res.propagateRoundMedianMs.push(+med(ts).toFixed(2));
        await sleep(30); // let background tier-up compiles run
      }
      // 2) steady state
      const steady = [];
      for (let i = 0; i < 100; i++) { const s = performance.now(); a.propagate_constellation((t += 16)); steady.push(performance.now() - s); }
      res.propagateSteadyMedianMs = +med(steady).toFixed(2);
      res.propagateSteadyMinMs = +Math.min(...steady).toFixed(2);

      // 3) JS->wasm call overhead: per-satellite getters (what the renderer does today)
      const n = a.get_satellite_count();
      const ffi = [];
      for (let k = 0; k < 20; k++) {
        const s = performance.now(); let sum = 0;
        for (let i = 0; i < n; i++) sum += a.get_sat_ecef_x(i) + a.get_sat_ecef_y(i) + a.get_sat_ecef_z(i);
        ffi.push(performance.now() - s);
        if (sum === 12345.678) log('x');
      }
      res.ffi3PerSatMedianMs = +med(ffi).toFixed(2);
      res.ffiCalls = n * 3;
      res.ffiNsPerCall = Math.round((med(ffi) * 1e6) / (n * 3));
      // 4) bulk path used by the renderer now: positions copied out of wasm memory in one call
      if (a.prepare_render_buffer) {
        const floats = a.prepare_render_buffer();
        const ptr = a.get_render_buffer_ptr();
        a.propagate_constellation((t += 16));
        const dst = new Float32Array(floats);
        const bulk = [];
        for (let k = 0; k < 50; k++) {
          const s = performance.now();
          dst.set(new Float32Array(a.memory.buffer, ptr, floats));
          bulk.push(performance.now() - s);
        }
        res.bulkCopyMedianMs = +med(bulk).toFixed(3);
      }
      // 5) slice cost linearity: 1/8 of the constellation should cost ~1/8 of a full pass
      if (a.propagate_constellation_slice) {
        const sl = [];
        for (let k = 0; k < 40; k++) { const s = performance.now(); a.propagate_constellation_slice((t += 16), k % 8, 8); sl.push(performance.now() - s); }
        res.slice1of8MedianMs = +med(sl).toFixed(2);
      }

      // 6) per-call timeline of the first calls after a fresh instantiate: a tiering engine
      //    (IPInt -> BBQ -> OMG) shows step-downs here; a flat line means no tier change.
      {
        const { instance: inst2 } = await WebAssembly.instantiate(wasmBuf, {});
        const b = inst2.exports;
        l1 = null;
        for (const l of tle.split('\n')) {
          if (l.startsWith('1 ') && l.length >= 61) l1 = l;
          else if (l.startsWith('2 ') && l1) {
            b.add_satellite_elements(parseInt(l1.slice(2, 7)), parseInt(l1.slice(18, 20)), parseFloat(l1.slice(20, 32)), exp(l1.slice(53, 61)), parseFloat(l.slice(8, 16)), parseFloat(l.slice(17, 25)), parseInt(l.slice(26, 33)) * 1e-7, parseFloat(l.slice(34, 42)), parseFloat(l.slice(43, 51)), parseFloat(l.slice(52, 63)));
            l1 = null;
          }
        }
        const tl = [];
        let t2 = Date.now();
        for (let i = 0; i < 40; i++) { const s = performance.now(); b.propagate_constellation((t2 += 16)); tl.push(+(performance.now() - s).toFixed(1)); if (i % 10 === 9) await sleep(50); }
        res.propagateFirst40CallsMs = tl;
      }

      // 7) engine probes (independent of this project's wasm): is the JS JIT on? how fast is a
      //    trivial wasm f64 loop, and does body size / locals / calls change the tier it ends in?
      res.probes = await engineProbes();
      out.textContent = JSON.stringify(res, null, 2);
    }

    // ---- engine probes -------------------------------------------------------------------
    // Hand-assembled wasm kernels so the result does not depend on the MoonBit compiler.
    // All kernels compute the same recurrence; `ns/f64op` should be ~0.3-1 ns on a JIT tier
    // (OMG / TurboFan), several ns on a baseline JIT (BBQ / Liftoff), and tens of ns in an
    // interpreter (IPInt). The per-call list shows tier-up steps (first calls slower).
    const C = 1.0000001, D = 0.999, E = 0.001;
    const leb = (n) => { const o = []; do { let b = n & 0x7f; n >>>= 7; if (n) b |= 0x80; o.push(b); } while (n); return o; };
    const f64c = (v) => { const b = new Uint8Array(8); new DataView(b.buffer).setFloat64(0, v, true); return [0x44, ...b]; };
    const str = (s) => [...leb(s.length), ...new TextEncoder().encode(s)];
    const vec = (items) => [...leb(items.length), ...items.flat()];
    const sect = (id, bytes) => [id, ...leb(bytes.length), ...bytes];
    const body = (locals, code) => { const b = [...vec(locals.map(([n, ty]) => [...leb(n), ty])), ...code, 0x0b]; return [...leb(b.length), ...b]; };
    const GET = (i) => [0x20, ...leb(i)], SET = (i) => [0x21, ...leb(i)];
    const F64 = 0x7c, I32 = 0x7f;
    // x = x*C + y ; y = y*D + x*E   (5 f64 ops)
    const step = () => [...GET(1), ...f64c(C), 0xa2, ...GET(2), 0xa0, ...SET(1), ...GET(2), ...f64c(D), 0xa2, ...GET(1), ...f64c(E), 0xa2, 0xa0, ...SET(2)];
    const loopWrap = (inner) => [
      ...f64c(1.0), ...SET(1), ...f64c(0.5), ...SET(2),
      0x02, 0x40, 0x03, 0x40, ...GET(0), 0x45, 0x0d, 0x01,
      ...inner,
      ...GET(0), 0x41, 0x01, 0x6b, ...SET(0), 0x0c, 0x00, 0x0b, 0x0b,
      ...GET(1), ...GET(2), 0xa0,
    ];
    function buildModule(kind) {
      // type 0: (i32) -> f64 ; type 1: (f64, f64) -> f64
      const types = sect(1, vec([[0x60, ...vec([[I32]]), ...vec([[F64]])], [0x60, ...vec([[F64], [F64]]), ...vec([[F64]])]]));
      let funcs, exportsB, codes, opsPerIter;
      const expK = (idx) => [...str('k'), 0x00, ...leb(idx)];
      if (kind === 'small') {
        funcs = sect(3, vec([[0]])); exportsB = sect(7, vec([expK(0)]));
        codes = sect(10, vec([body([[2, F64]], loopWrap(step()))])); opsPerIter = 5;
      } else if (kind === 'locals400unused') {
        funcs = sect(3, vec([[0]])); exportsB = sect(7, vec([expK(0)]));
        codes = sect(10, vec([body([[402, F64]], loopWrap(step()))])); opsPerIter = 5;
      } else if (kind === 'locals400used') {
        // l3 = x*C + y ; l4 = l3*C + y ; ... ; x = l402  (2 f64 ops per local)
        const L = 400; const chain = [];
        for (let i = 0; i < L; i++) chain.push(...GET(i === 0 ? 1 : 2 + i), ...f64c(C), 0xa2, ...GET(2), 0xa0, ...SET(3 + i));
        chain.push(...GET(2 + L), ...SET(1));
        funcs = sect(3, vec([[0]])); exportsB = sect(7, vec([expK(0)]));
        codes = sect(10, vec([body([[2 + L, F64]], loopWrap([...step(), ...chain]))])); opsPerIter = 5 + 2 * L;
      } else if (kind === 'bigbody5k') {
        const reps = []; for (let i = 0; i < 400; i++) reps.push(...step());
        funcs = sect(3, vec([[0]])); exportsB = sect(7, vec([expK(0)]));
        codes = sect(10, vec([body([[2, F64]], loopWrap(reps))])); opsPerIter = 5 * 400;
      } else if (kind === 'smallSimd') {
        // same recurrence, but x*C goes through f64x2 (splat, mul, extract_lane 0): a function
        // containing SIMD may be routed to a different tier than scalar code (WebKit bug 284337).
        const inner = [...GET(1), 0xfd, 0x14, ...f64c(C), 0xfd, 0x14, 0xfd, 0xf2, 0x01, 0xfd, 0x21, 0x00, ...GET(2), 0xa0, ...SET(1), ...GET(2), ...f64c(D), 0xa2, ...GET(1), ...f64c(E), 0xa2, 0xa0, ...SET(2)];
        funcs = sect(3, vec([[0]])); exportsB = sect(7, vec([expK(0)]));
        codes = sect(10, vec([body([[2, F64]], loopWrap(inner))])); opsPerIter = 5;
      } else if (kind === 'callPerIter') {
        // helper(x, y) = x*C + y ; kernel: x = helper(x, y); y = y*D + x*E
        const helper = body([], [...GET(0), ...f64c(C), 0xa2, ...GET(1), 0xa0]);
        const inner = [...GET(1), ...GET(2), 0x10, 0x01, ...SET(1), ...GET(2), ...f64c(D), 0xa2, ...GET(1), ...f64c(E), 0xa2, 0xa0, ...SET(2)];
        funcs = sect(3, vec([[0], [1]])); exportsB = sect(7, vec([expK(0)]));
        codes = sect(10, vec([body([[2, F64]], loopWrap(inner)), helper])); opsPerIter = 5;
      }
      return { bytes: new Uint8Array([0x00, 0x61, 0x73, 0x6d, 1, 0, 0, 0, ...types, ...funcs, ...exportsB, ...codes]), opsPerIter };
    }
    async function engineProbes() {
      const r = {};
      // JS JIT probe: same recurrence in JS. ~1 ns/op with a JIT, tens of ns interpreted.
      {
        const N = 2e6; const per = [];
        let x = 1, y = 0.5;
        for (let c = 0; c < 6; c++) { const s = performance.now(); for (let i = 0; i < N; i++) { x = x * C + y; y = y * D + x * E; } per.push(performance.now() - s); }
        if (x === 42) log('x');
        r.jsLoopNsPerF64Op = +((med(per) * 1e6) / (N * 5)).toFixed(2);
        r.jsLoopCallsMs = per.map((v) => +v.toFixed(1));
      }
      // JS typed-array pass like the renderer's per-frame style/trail loop (10,652 entries)
      {
        const n = 10652; const st = new Uint8Array(n); const pos = new Float32Array(n * 3); const trail = new Float32Array(n * 6); const style = new Float32Array(n);
        for (let i = 0; i < n; i++) { st[i] = 8 | (i % 5); pos[i * 3] = i; }
        const per = [];
        for (let c = 0; c < 30; c++) {
          const s = performance.now();
          for (let i = 0; i < n; i++) { const v = st[i]; if ((v & 8) === 0) { style[i] = -1; continue; } const i3 = i * 3; const px = pos[i3], py = pos[i3 + 1], pz = pos[i3 + 2]; const t6 = i * 6; trail[t6] = px - 0.01; trail[t6 + 1] = py; trail[t6 + 2] = pz; trail[t6 + 3] = px; trail[t6 + 4] = py; trail[t6 + 5] = pz; const sty = (v & 16) ? 16 : (v & 7); if (style[i] !== sty) style[i] = sty; }
          per.push(performance.now() - s);
        }
        r.jsTypedArrayPassMs = +med(per).toFixed(3);
      }
      for (const kind of ['small', 'smallSimd', 'locals400unused', 'locals400used', 'bigbody5k', 'callPerIter']) {
        try {
          const { bytes, opsPerIter } = buildModule(kind);
          const c0 = performance.now();
          const { instance } = await WebAssembly.instantiate(bytes, {});
          const instMs = performance.now() - c0;
          const iters = Math.max(1000, Math.round(1e7 / opsPerIter)); // ~1e7 f64 ops per call
          const per = []; let acc = 0;
          for (let c = 0; c < 8; c++) { const s = performance.now(); acc += instance.exports.k(iters); per.push(performance.now() - s); if (c === 3) await sleep(50); }
          if (acc === 42) log('x');
          r['wasm_' + kind] = { nsPerF64Op: +((med(per.slice(4)) * 1e6) / (iters * opsPerIter)).toFixed(2), callsMs: per.map((v) => +v.toFixed(1)), instantiateMs: +instMs.toFixed(2), bytes: bytes.length };
        } catch (e) { r['wasm_' + kind] = 'ERROR ' + e.message; }
      }
      return r;
    }

    document.getElementById('run').onclick = () => run().catch((e) => { out.textContent = 'ERROR ' + e.message; });
    document.getElementById('copy').onclick = () => {
      const ta = document.createElement('textarea');
      ta.value = out.textContent; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;font-size:16px;opacity:0';
      document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
      const ok = document.execCommand('copy'); document.body.removeChild(ta);
      document.getElementById('copy').textContent = ok ? 'Copied ✓' : 'Copy失敗(手で選択してください)';
    };
  </script>
</body>
</html>
